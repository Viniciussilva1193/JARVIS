<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>

    <style>
        body {
            margin: 0;
            background: #0a0f14;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .jarvis {
            text-align: center;
        }

        h1 {
            font-size: 50px;
            letter-spacing: 8px;
        }

        p {
            color: #aaa;
            font-size: 18px;
        }

        button {
            margin-top: 25px;
            padding: 15px 35px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="jarvis">
        <h1>JARVIS</h1>
        <p>Seu assistente virtual está online.</p>

        <button>🎙️ Falar com JARVIS</button>
    </div>

</body>
</html>
